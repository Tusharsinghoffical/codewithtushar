services:
  - type: static
    name: codewithtushar
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # Custom domains — configure in Render dashboard:
    # 1. www.codewithtushar.me / codewithtushar.me (Primary)
    headers:
      # Cache hashed assets forever (Vite adds content hashes to filenames)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Don't cache HTML — always fetch fresh so deploys take effect immediately
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      # Security headers
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
    routes:
      # SPA fallback — all routes serve index.html so React Router handles them
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_APP_URL
        value: https://www.codewithtushar.me
