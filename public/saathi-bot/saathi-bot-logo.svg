<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="logoChassis" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0E2E3B" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <linearGradient id="logoGlow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="logoTextGrad" x1="72" y1="20" x2="210" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <filter id="logoBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Mascot Robot Icon (Left) -->
  <g transform="translate(2, 2) scale(0.9375)">
    <!-- Chassis -->
    <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#logoChassis)" stroke="url(#logoGlow)" stroke-width="2.5" />
    <!-- Antenna -->
    <path d="M32 3 V10" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
    <circle cx="32" cy="3" r="2.5" fill="#22D3EE" filter="url(#logoBloom)" />
    <!-- Ears -->
    <rect x="1.5" y="24" width="3" height="10" rx="1.5" fill="#14B8A6" />
    <rect x="59.5" y="24" width="3" height="10" rx="1.5" fill="#14B8A6" />
    <!-- Visor -->
    <rect x="12" y="16" width="40" height="30" rx="10" fill="#020617" stroke="#1E293B" stroke-width="1.2" />
    <!-- Glowing Eyes -->
    <g filter="url(#logoBloom)">
      <rect x="19" y="24" width="7" height="10" rx="3.5" fill="#22D3EE" />
      <circle cx="21" cy="26" r="1.2" fill="#FFFFFF" />
      <rect x="38" y="24" width="7" height="10" rx="3.5" fill="#22D3EE" />
      <circle cx="40" cy="26" r="1.2" fill="#FFFFFF" />
    </g>
    <!-- Smile -->
    <path d="M25 39 Q32 44 39 39" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#logoBloom)" />
    <!-- Light -->
    <circle cx="32" cy="52" r="1.8" fill="#10B981" filter="url(#logoBloom)" />
  </g>

  <!-- Typography: Saathi Bot -->
  <text x="74" y="36" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="url(#logoTextGrad)" letter-spacing="-0.5">Saathi Bot</text>

  <!-- Subtitle Tag -->
  <text x="74" y="50" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#06B6D4" letter-spacing="1.2">GROUNDED AI SaaS</text>
</svg>
