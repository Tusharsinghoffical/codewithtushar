<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favChassis" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0E2E3B" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <linearGradient id="favGlow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="favVisor" x1="16" y1="20" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <filter id="favBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Head Chassis -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#favChassis)" stroke="url(#favGlow)" stroke-width="2.5" />

  <!-- Antenna -->
  <path d="M32 3 V10" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
  <circle cx="32" cy="3" r="2.5" fill="#22D3EE" filter="url(#favBloom)" />
  <circle cx="32" cy="3" r="1.2" fill="#FFFFFF" />

  <!-- Ears -->
  <rect x="1.5" y="24" width="3" height="10" rx="1.5" fill="#14B8A6" />
  <rect x="59.5" y="24" width="3" height="10" rx="1.5" fill="#14B8A6" />

  <!-- Visor -->
  <rect x="12" y="16" width="40" height="30" rx="10" fill="url(#favVisor)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Forehead circuit -->
  <path d="M26 19 L32 22 L38 19" stroke="#0891B2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

  <!-- Glowing Eyes -->
  <g filter="url(#favBloom)">
    <rect x="19" y="24" width="7" height="10" rx="3.5" fill="#22D3EE" />
    <circle cx="21" cy="26" r="1.2" fill="#FFFFFF" />
    <rect x="38" y="24" width="7" height="10" rx="3.5" fill="#22D3EE" />
    <circle cx="40" cy="26" r="1.2" fill="#FFFFFF" />
  </g>

  <!-- Smile Wave -->
  <path d="M25 39 Q32 44 39 39" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#favBloom)" />

  <!-- Status Light -->
  <circle cx="32" cy="52" r="1.8" fill="#10B981" filter="url(#favBloom)" />
</svg>
