      <stop stop-color="#081014"/>
      <stop offset="0.5" stop-color="#091a18"/>
      <stop offset="1" stop-color="#061210"/>
    </linearGradient>
    <filter id="p4_glow" x="-20%" y="-20%" width="140%" height="140%">
