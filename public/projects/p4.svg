  <text x="220" y="422" fill="#86efac" font-family="sans-serif" font-size="11" font-weight="700">✓ Booking Confirmed &amp; Logged</text>
  <text x="515" y="435" fill="#86efac" font-family="sans-serif" font-size="11">✓✓</text>

