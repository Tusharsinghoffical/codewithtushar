  <rect x="650" y="225" width="450" height="100" rx="16" fill="#061210" stroke="#1b4d44" stroke-width="1"/>
  <text x="675" y="255" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">HOURS SAVED PER DAY</text>
  <text x="675" y="305" fill="#25d366" font-family="sans-serif" font-size="42" font-weight="900">4+ hrs</text>
  <text x="820" y="280" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Eliminated Manual Replies</text>
  <text x="820" y="300" fill="#64748b" font-family="sans-serif" font-size="11">Zero missed leads after-hours</text>

  <!-- Big Stat 2 -->
  <rect x="650" y="345" width="450" height="100" rx="16" fill="#061210" stroke="#1b4d44" stroke-width="1"/>
  <text x="675" y="375" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">APPOINTMENT CONVERSION</text>
  <text x="675" y="425" fill="#38bdf8" font-family="sans-serif" font-size="42" font-weight="900">+35%</text>
  <text x="820" y="400" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Higher Booking Velocity</text>
  <text x="820" y="420" fill="#64748b" font-family="sans-serif" font-size="11">From immediate automated follow-up</text>

  <!-- Technology Badges -->
  <g transform="translate(650, 480)">
    <rect x="0" y="0" width="140" height="38" rx="10" fill="#132a26" stroke="#1b4d44" stroke-width="1"/>
    <text x="25" y="24" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="700">WhatsApp API</text>

    <rect x="155" y="0" width="130" height="38" rx="10" fill="#132a26" stroke="#1b4d44" stroke-width="1"/>
    <text x="182" y="24" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="700">n8n Automation</text>

    <rect x="300" y="0" width="130" height="38" rx="10" fill="#132a26" stroke="#1b4d44" stroke-width="1"/>
    <text x="325" y="24" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="700">OpenAI LLMs</text>
  </g>
