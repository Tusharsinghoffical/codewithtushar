    <path d="M100 0 V675 M200 0 V675 M300 0 V675 M400 0 V675 M500 0 V675 M600 0 V675 M700 0 V675 M800 0 V675 M900 0 V675 M1000 0 V675 M1100 0 V675"/>
  </g>

  <circle cx="200" cy="200" r="180" fill="#25d366" opacity="0.16" filter="url(#p4_glow)"/>
  <circle cx="950" cy="450" r="200" fill="#0d9488" opacity="0.14" filter="url(#p4_glow)"/>

  <!-- Top Header -->
  <rect x="70" y="55" width="1060" height="56" rx="16" fill="#132a26" fill-opacity="0.6" stroke="#1b4d44" stroke-width="1.5"/>
