<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p10_bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0f1d"/>
      <stop offset="0.5" stop-color="#0e172e"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="p10_card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="p10_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#p10_bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200"/>
    <path d="M100 0 V675 M200 0 V675 M300 0 V675 M400 0 V675 M500 0 V675 M600 0 V675 M700 0 V675 M800 0 V675 M900 0 V675 M1000 0 V675 M1100 0 V675"/>
  </g>

  <circle cx="200" cy="200" r="180" fill="#0284c7" opacity="0.16" filter="url(#p10_glow)"/>
  <circle cx="1000" cy="450" r="220" fill="#10b981" opacity="0.15" filter="url(#p10_glow)"/>

  <!-- Top Header Bar -->
  <rect x="70" y="55" width="1060" height="56" rx="16" fill="#132337" fill-opacity="0.6" stroke="#1e3a5f" stroke-width="1.5"/>
  <circle cx="105" cy="83" r="6" fill="#ef4444"/>
  <circle cx="125" cy="83" r="6" fill="#f59e0b"/>
  <circle cx="145" cy="83" r="6" fill="#38bdf8"/>
  <text x="175" y="88" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Power BI Healthcare Analytics • Multi-Department Bed &amp; Patient Intelligence</text>
  
  <rect x="890" y="70" width="120" height="26" rx="8" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="905" cy="83" r="4" fill="#38bdf8"/>
  <text x="918" y="87" fill="#7dd3fc" font-family="sans-serif" font-size="11" font-weight="700">LIVE BI SYNC</text>

  <!-- Left: KPI Cards & Capacity Breakdown -->
  <rect x="70" y="130" width="620" height="490" rx="20" fill="url(#p10_card)" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="100" y="175" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="800">Hospital Operational KPIs</text>
  <text x="100" y="198" fill="#38bdf8" font-family="sans-serif" font-size="12">3 Hospital Branches • Real-Time SQL DirectQuery</text>

  <!-- 3 Top Metric Cards -->
  <g transform="translate(95, 220)">
    <rect x="0" y="0" width="175" height="95" rx="14" fill="#0c1628" stroke="#1e3a5f" stroke-width="1"/>
    <text x="18" y="28" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700">BED UTILIZATION</text>
    <text x="18" y="68" fill="#38bdf8" font-family="sans-serif" font-size="30" font-weight="900">88.4%</text>
    <text x="18" y="85" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">+18% Efficiency</text>

    <rect x="195" y="0" width="175" height="95" rx="14" fill="#0c1628" stroke="#1e3a5f" stroke-width="1"/>
    <text x="213" y="28" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700">DAILY PATIENT FLOW</text>
    <text x="213" y="68" fill="#f8fafc" font-family="sans-serif" font-size="30" font-weight="900">1,240</text>
    <text x="213" y="85" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">Across 3 branches</text>

    <rect x="390" y="0" width="180" height="95" rx="14" fill="#0c1628" stroke="#1e3a5f" stroke-width="1"/>
    <text x="408" y="28" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700">DECISION LAG</text>
    <text x="408" y="68" fill="#10b981" font-family="sans-serif" font-size="30" font-weight="900">&lt; 1 min</text>
    <text x="408" y="85" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">Reduced from 30 days</text>
  </g>

  <!-- Department Occupancy Chart -->
  <g transform="translate(95, 340)">
    <rect x="0" y="0" width="570" height="250" rx="16" fill="#0c1628" stroke="#1e3a5f" stroke-width="1"/>
    <text x="25" y="32" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Department Occupancy &amp; Emergency Bottleneck Analysis</text>
    
    <!-- Bar 1: ICU -->
    <text x="25" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="12">Intensive Care Unit (ICU)</text>
    <rect x="25" y="80" width="520" height="18" rx="6" fill="#1e293b"/>
    <rect x="25" y="80" width="470" height="18" rx="6" fill="#ef4444"/>
    <text x="500" y="94" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="700">92%</text>

    <!-- Bar 2: Cardiology -->
    <text x="25" y="125" fill="#cbd5e1" font-family="sans-serif" font-size="12">Cardiology &amp; Surgery</text>
    <rect x="25" y="135" width="520" height="18" rx="6" fill="#1e293b"/>
    <rect x="25" y="135" width="430" height="18" rx="6" fill="#38bdf8"/>
    <text x="460" y="149" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="700">84%</text>

    <!-- Bar 3: Pediatrics -->
    <text x="25" y="180" fill="#cbd5e1" font-family="sans-serif" font-size="12">Pediatrics &amp; General Ward</text>
    <rect x="25" y="190" width="520" height="18" rx="6" fill="#1e293b"/>
    <rect x="25" y="190" width="370" height="18" rx="6" fill="#10b981"/>
    <text x="400" y="204" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="700">71%</text>
  </g>

  <!-- Right: Power BI DAX & Insights Column -->
  <rect x="720" y="130" width="410" height="490" rx="20" fill="url(#p10_card)" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="750" y="175" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="800">Business Impact</text>
  <text x="750" y="198" fill="#38bdf8" font-family="sans-serif" font-size="12">Healthcare Administration ROI</text>

  <!-- Impact 1 -->
  <rect x="750" y="225" width="350" height="110" rx="16" fill="#0c1628" stroke="#1e3a5f" stroke-width="1"/>
  <text x="770" y="255" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">REPORTING CYCLE SPEED</text>
  <text x="770" y="305" fill="#10b981" font-family="sans-serif" font-size="40" font-weight="900">30x</text>
  <text x="860" y="280" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Faster Decisions</text>
  <text x="860" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11">From monthly to real-time</text>

  <!-- Impact 2 -->
  <rect x="750" y="355" width="350" height="110" rx="16" fill="#0c1628" stroke="#1e3a5f" stroke-width="1"/>
  <text x="770" y="385" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">STAFF OVERTIME SAVED</text>
  <text x="770" y="435" fill="#38bdf8" font-family="sans-serif" font-size="40" font-weight="900">-22%</text>
  <text x="875" y="410" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Optimized Shifts</text>
  <text x="875" y="430" fill="#94a3b8" font-family="sans-serif" font-size="11">Predictive bed planning</text>

  <!-- Tech tags -->
  <g transform="translate(750, 490)">
    <rect x="0" y="0" width="105" height="38" rx="10" fill="#0c1628" stroke="#1e3a5f" stroke-width="1"/>
    <text x="18" y="24" fill="#7dd3fc" font-family="sans-serif" font-size="12" font-weight="700">Power BI</text>

    <rect x="120" y="0" width="105" height="38" rx="10" fill="#0c1628" stroke="#1e3a5f" stroke-width="1"/>
    <text x="145" y="24" fill="#7dd3fc" font-family="sans-serif" font-size="12" font-weight="700">DAX</text>

    <rect x="240" y="0" width="105" height="38" rx="10" fill="#0c1628" stroke="#1e3a5f" stroke-width="1"/>
    <text x="260" y="24" fill="#7dd3fc" font-family="sans-serif" font-size="12" font-weight="700">SQL Server</text>
  </g>
</svg>