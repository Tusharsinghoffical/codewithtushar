    <text x="245" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Dynamic Personalization</text>
    <text x="245" y="93" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">&amp; VSL High-Intent Quiz</text>
    <rect x="245" y="125" width="150" height="34" rx="8" fill="#1e293b"/>
    <text x="260" y="146" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="700">42% Opt-in Rate</text>

    <!-- Connector 2 -->
    <path d="M415 90 H450" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Stage 3 -->
    <rect x="450" y="0" width="190" height="180" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="485" cy="35" r="16" fill="#10b981" fill-opacity="0.2"/>
    <text x="478" y="42" fill="#34d399" font-family="sans-serif" font-size="18">📅</text>
    <text x="515" y="38" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Sales Booking</text>
    <text x="470" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Automated Calendar</text>
    <text x="470" y="93" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Sync &amp; CRM Pipeline</text>
    <rect x="470" y="125" width="150" height="34" rx="8" fill="#10b981" fill-opacity="0.2"/>
    <text x="485" y="146" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="800">254 Qualified</text>
