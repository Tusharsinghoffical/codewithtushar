    <rect x="0" y="0" width="640" height="210" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="35" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Cumulative Lead Velocity (Days 1–10)</text>
    
    <!-- Graph Curve -->
    <path d="M30 170 C 120 160, 200 130, 280 110 C 360 90, 480 50, 610 30" fill="none" stroke="#6366f1" stroke-width="4"/>
    <path d="M30 170 C 120 160, 200 130, 280 110 C 360 90, 480 50, 610 30 L 610 180 L 30 180 Z" fill="url(#primary)" opacity="0.12"/>
    
    <!-- Data points -->
    <circle cx="280" cy="110" r="5" fill="#6366f1" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="610" cy="30" r="6" fill="#10b981" stroke="#f8fafc" stroke-width="2"/>
    
    <text x="480" y="32" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="800">Day 10: 254 Leads</text>
